{% extends "fitness/base.html" %}

{% block title %}Додати прогрес{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">
                <h2 class="mb-0">Записати вагу</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="mb-3">
                        {{ form.weight.label_tag }}
                        {{ form.weight }}
                    </div>
                    <div class="mb-3">
                        {{ form.date.label_tag }}
                        {{ form.date }}
                    </div>
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
